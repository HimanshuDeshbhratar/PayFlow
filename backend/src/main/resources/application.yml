spring:
  application:
    name: payflow-backend
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:payflow}
    username: ${POSTGRES_USER:payflow}
    password: ${POSTGRES_PASSWORD:payflow_dev_change_me}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: payflow-backend
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  info:
    env:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

payflow:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-secret-at-least-256-bits-for-hs256-payflow-demo}
    access-token-expiry-ms: ${JWT_ACCESS_TOKEN_EXPIRY_MS:900000}
    refresh-token-expiry-ms: ${JWT_REFRESH_TOKEN_EXPIRY_MS:604800000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  rate-limit:
    login-per-minute: ${RATE_LIMIT_LOGIN_PER_MINUTE:5}
    payment-per-minute: ${RATE_LIMIT_PAYMENT_PER_MINUTE:30}
  fraud:
    block-threshold: 80
    review-threshold: 60
    high-amount-cents: 200000
    velocity-window-minutes: 10
    velocity-max-count: 5
  idempotency:
    ttl-seconds: 86400
  demo:
    admin-email: ${DEMO_ADMIN_EMAIL:admin@payflow.demo}
    admin-password: ${DEMO_ADMIN_PASSWORD:PayFlowAdmin!2026}
    merchant-email: ${DEMO_MERCHANT_EMAIL:merchant@payflow.demo}
    merchant-password: ${DEMO_MERCHANT_PASSWORD:PayFlowMerchant!2026}
    risk-email: ${DEMO_RISK_EMAIL:risk@payflow.demo}
    risk-password: ${DEMO_RISK_PASSWORD:PayFlowRisk!2026}
  kafka:
    topics:
      payment-events: payflow.payment.events
      fraud-events: payflow.fraud.events
      notification-events: payflow.notification.events
      settlement-events: payflow.settlement.events

logging:
  level:
    root: INFO
    com.payflow: INFO
    org.springframework.security: WARN

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://postgres:5432/${POSTGRES_DB:payflow}
  data:
    redis:
      host: redis
  kafka:
    bootstrap-servers: kafka:9092

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:payflow;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers:localhost:9092}
  autoconfigure:
    exclude: []
